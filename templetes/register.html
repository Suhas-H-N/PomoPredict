<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up — PomoPredict</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% include "_nav.html" %}
  <div class="container">
    <h1>Create an account</h1>
    <p class="subtitle">Optional — lets you save history, download PDF reports, and flag corrections.</p>

    {% if error %}
      <div class="alert">{{ error }}</div>
    {% endif %}

    <form method="POST" class="auth-form">
      <label>Username
        <input type="text" name="username" required autofocus autocomplete="username" maxlength="40">
      </label>
      <label>Password
        <input type="password" name="password" required autocomplete="new-password" minlength="6">
      </label>
      <button type="submit">Sign up</button>
    </form>

    <p class="hint">Already have an account? <a href="{{ url_for('login') }}">Log in</a>.</p>
  </div>
</body>
</html>
