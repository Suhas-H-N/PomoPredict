<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — PomoPredict</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% include "_nav.html" %}
  <div class="container">
    <h1>Log in</h1>
    <p class="subtitle">Optional — lets you save history, download PDF reports, and flag corrections.</p>

    {% if error %}
      <div class="alert">{{ error }}</div>
    {% endif %}

    <form method="POST" class="auth-form">
      <label>Username
        <input type="text" name="username" required autofocus autocomplete="username">
      </label>
      <label>Password
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <button type="submit">Log in</button>
    </form>

    <p class="hint">No account? <a href="{{ url_for('register') }}">Sign up</a>.
      Or just <a href="{{ url_for('index') }}">continue as a guest</a>.</p>
  </div>
</body>
</html>
